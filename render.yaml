services:
  - type: web
    name: agape-care-api
    env: node
    plan: free
    region: singapore # or oregon, frankfurt
    buildCommand: pnpm install && pnpm db:generate && pnpm build:api
    startCommand: node dist/apps/api/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
