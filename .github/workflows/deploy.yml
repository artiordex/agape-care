# Description : deploy.yml - Docker build and push to GHCR
# Author : Shiwoo Min
# Updated : 2026-02-18

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NS: artiordex/agape-care

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api, admin, web, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.api'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.admin'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.web'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'infra/docker/Dockerfile.worker'
            shared:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'nx.json'
              - 'tsconfig.base.json'
              - '.dockerignore'

      - name: Check build gate
        id: gate
        shell: bash
        run: |
          if [ "${{ steps.changes.outputs[matrix.service] }}" != "true" ] && [ "${{ steps.changes.outputs.shared }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.gate.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agape-${{ matrix.service }}
          cache-to: type=gha,scope=agape-${{ matrix.service }},mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
