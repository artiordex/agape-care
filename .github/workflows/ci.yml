# Description : ci.yml - CI pipeline for Agape Care monorepo
# Author : Shiwoo Min
# Updated : 2026-02-18

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '9.15.4'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm nx run-many -t build -p @agape-care/web @agape-care/admin @agape-care/api @agape-care/worker --skip-nx-cache

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/apps/web
            dist/apps/admin
            dist/apps/api
            dist/apps/worker
          retention-days: 1
          if-no-files-found: warn
